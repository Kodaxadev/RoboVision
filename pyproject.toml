[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robovision"
version = "0.1.0"
description = "Editor-agnostic protocol and client for the RoboVision 3D AI control plane"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["robovision*"]
exclude = ["hosts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
