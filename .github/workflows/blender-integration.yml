name: blender-integration

on:
  push:
    paths:
      - "hosts/blender/**"
      - "tests/blender/**"
      - ".github/workflows/blender-integration.yml"
  pull_request:
    paths:
      - "hosts/blender/**"
      - "tests/blender/**"
      - ".github/workflows/blender-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blender-5-2-lts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BLENDER_VERSION: "5.2.1"
      BLENDER_SERIES: "5.2"
      BLENDER_ARCHIVE: "blender-5.2.1-linux-x64.tar.xz"
      BLENDER_DIR: ".cache/blender/blender-5.2.1-linux-x64"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender LTS
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .cache/blender
          key: blender-linux-x64-5.2.1

      - name: Download Blender 5.2.1 LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/blender
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/${BLENDER_ARCHIVE}" \
            --output ".cache/blender/${BLENDER_ARCHIVE}"
          tar -xJf ".cache/blender/${BLENDER_ARCHIVE}" -C .cache/blender
          rm ".cache/blender/${BLENDER_ARCHIVE}"

      - name: Install virtual display dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 \
            libxkbcommon0 libxkbcommon-x11-0 libsm6 libice6

      - name: Verify Blender version
        shell: bash
        run: |
          "${BLENDER_DIR}/blender" --version | head -n 2

      - name: Run semantic mesh addressing tests
        shell: bash
        run: |
          set -euo pipefail
          "${BLENDER_DIR}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender/semantic_query.py

      - name: Run RoboVision Gate 0 transport over a real socket
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/blender-gate0-transport
          "${BLENDER_DIR}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender/gate0_transport.py

      - name: Run RoboVision document lifecycle gauntlet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/blender-lifecycle
          "${BLENDER_DIR}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender/lifecycle_document.py

      - name: Run RoboVision add-on lifecycle gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/blender-addon-lifecycle
          "${BLENDER_DIR}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender/lifecycle_addon.py

      - name: Run RoboVision transaction ownership gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/blender-transaction-ownership
          "${BLENDER_DIR}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender/transaction_ownership.py

      - name: Run RoboVision MCP session gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/blender-mcp-session
          "${BLENDER_DIR}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender/mcp_session.py

      - name: Run RoboVision idempotency gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/blender-idempotency
          "${BLENDER_DIR}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender/idempotency.py

      - name: Run RoboVision change journal gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/blender-journal
          "${BLENDER_DIR}/blender" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender/journal_gate.py

      - name: Run RoboVision Blender restart gate
        shell: bash
        env:
          BLENDER: ${{ github.workspace }}/.cache/blender/blender-5.2.1-linux-x64/blender
        run: |
          set -euo pipefail
          bash tools/blender-restart-gate.sh

      - name: Run RoboVision Gate 1 in interactive Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/blender-gate1
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            "${BLENDER_DIR}/blender" \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender/gate1.py

      - name: Run RoboVision Gate 1 adversarial paths in interactive Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/blender-gate1-adversarial
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            "${BLENDER_DIR}/blender" \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender/gate1_adversarial.py

      - name: Soak RoboVision Gate 1 in interactive Blender
        shell: bash
        env:
          ROBOVISION_SOAK_CYCLES: "250"
        run: |
          set -euo pipefail
          mkdir -p artifacts/blender-gate1-soak
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            "${BLENDER_DIR}/blender" \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender/gate1_soak.py

      - name: Run RoboVision Gate 2 perception in interactive Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/blender-gate2
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            "${BLENDER_DIR}/blender" \
            --factory-startup \
            --python-exit-code 1 \
            --python tests/blender/gate2.py

      - name: Upload Blender evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-5.2.1-robovision-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
